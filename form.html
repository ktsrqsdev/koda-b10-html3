<!doctype html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Data Survei Perokok</title>
</head>
<body>
    <main class="container data-container">
        <section class="card-title">
            <h1>Data Perokok</h1>
            <p>Berikut adalah data yang sudah dikirim melalui form.</p>
        </section>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th rowspan="2">No</th>
                        <th rowspan="2">Nama</th>
                        <th rowspan="2">Umur</th>
                        <th rowspan="2">Jenis Kelamin</th>
                        <th rowspan="2">Perokok</th>
                        <th colspan="4">Jenis Rokok</th>
                    </tr>
                    <tr>
                        <th>Gudang Garam Filter</th>
                        <th>Lucky Strike</th>
                        <th>Marlboro</th>
                        <th>Esse</th>
                    </tr>
                </thead>

                <tbody id="dataPerokok">
                    <tr>
                        <td colspan="9" class="empty-data">Belum ada data yang dikirim.</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="check-data">
            <a href="index.html">← Back</a>
        </div>
    </main>
</body>
</html>
