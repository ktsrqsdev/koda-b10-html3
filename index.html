<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>form</title>
  </head>
  <body>
    <form action="">
      <div>
        <label for="nama">Siapa nama anda?</label><br>
        <input type="text" name="nama" id="nama" required />
      </div>
      <div>
        <label for="umur">Berapa umur anda?</label><br>
        <input type="number" name="umur" id="umur" required />
      </div>

      <div>
        <label for="kelamin">Apa jenis kelamin anda?</label><br>
        <label><input type="radio" name="kelamin" value="L" id="kelamin"/> Laki-laki</label>
        <label><input type="radio" name="kelamin" value="P" id="kelamin"/> Perempuan</label>
      </div>

      <div>
        <label for="perokok">Apakah anda perokok?</label><br>
        <label><input type="radio" name="perokok" value="yes" id="perokok" /> Ya</label>
        <label><input type="radio" name="perokok" value="no" id="perokok" /> Tidak</label>
      </div>

      <div>
        <label for="cbperokok">Jika anda perokok, rokok apa yang anda pernah coba?</label><br>
        <label><input type="checkbox" value="ggf" id="cbperokok" /> Gudang Garam Filter</label><br>
        <label><input type="checkbox" value="ls" id="cbperokok" /> Lucky Strike</label><br>
        <label><input type="checkbox" value="m" id="cbperokok" /> Marlboro</label><br>
        <label><input type="checkbox" value="ggf" id="cbperokok" /> Esse</label><br>
      </div>
      <div>
        <input type="submit" value="submit">
        <input type="reset" value="reset">
      </div>
    </form>
  </body>
</html>
