<!doctype html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <title>Form Perokok</title>
    </head>

    <body>
        <main class="container">
            <section class="card-title">
                <h1>Form Perokok</h1>
                <p>Form ini untuk mendata siapa yang perokok dan yang tidak perokok.</p>
                <p class="required">* Menunjukkan pertanyaan yang wajib diisi</p>
            </section>

            <form id="formPerokok">
                <div class="card required">
                    <label for="nama">Siapa nama Anda?</label>
                    <input type="text" name="nama" id="nama" placeholder="Jawaban Anda" required>
                </div>

                <div class="card required">
                    <label for="umur">Berapa umur Anda?</label>
                    <input type="number" name="umur" id="umur" placeholder="Jawaban Anda" required>
                </div>

                <div class="card required">
                    <p class="question">Apa jenis kelamin Anda?</p>
                    <div>
                        <label><input type="radio" name="kelamin" value="Laki-laki" required> Laki-laki</label>
                    </div>
                    <div>
                        <label><input type="radio" name="kelamin" value="Perempuan"> Perempuan</label>
                    </div>
                </div>

                <div class="card required">
                    <p class="question">Apakah Anda perokok?</p>
                    <div>
                        <label><input type="radio" name="perokok" value="Ya" required> Ya</label>
                    </div>
                    <div>
                        <label><input type="radio" name="perokok" value="Tidak"> Tidak</label>
                    </div>
                </div>

                <div class="card">
                    <p class="question">Jika Anda perokok, rokok apa yang pernah Anda coba?</p>
                    <div>
                        <label><input type="checkbox" name="rokok" value="Gudang Garam Filter"> Gudang Garam Filter</label>
                    </div>
                    <div>
                        <label><input type="checkbox" name="rokok" value="Lucky Strike"> Lucky Strike</label>
                    </div>
                    <div>
                        <label><input type="checkbox" name="rokok" value="Marlboro"> Marlboro</label>
                    </div>
                    <div>
                        <label><input type="checkbox" name="rokok" value="Esse"> Esse</label>
                    </div>
                </div>

                <div class="btn">
                    <input type="submit" value="Submit">
                    <input type="reset" value="Reset">
                </div>
            </form>

            <div class="check-data">
                <a href="form.html">→ Check Data</a>
            </div>
        </main>
        <script src="script.js"></script>
    </body>

</html>
