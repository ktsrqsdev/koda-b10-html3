<!doctype html>
<html lang="id">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <title>Form Perokok</title>
    </head>

    <body class="min-h-screen bg-[#f0efff] px-4 py-3 text-[#202124]">

        <main class="mx-auto max-w-[640px]">

            <section class="mb-2 overflow-hidden rounded border border-[#dadce0] bg-white">
                <div class="h-[6px] bg-[#5b4de0]"></div>

                <div class="px-4 pt-3 pb-2">
                    <h1 class="mb-1 text-2xl font-normal">
                        Form Perokok
                    </h1>

                    <p class="text-xs">
                        Form ini untuk mendata siapa yang perokok dan yang tidak perokok.
                    </p>
                </div>

                <div class="border-t border-[#dadce0] px-4 py-2">
                    <p class="text-xs text-[#d93025]">
                        * Menunjukkan pertanyaan yang wajib diisi
                    </p>
                </div>
            </section>

            <form id="formPerokok" class="space-y-2">

                <div class="rounded border border-[#dadce0] bg-white px-4 py-4">
                    <label for="nama" class="mb-4 block text-sm">
                        Siapa nama anda <span class="text-[#d93025]">*</span>
                    </label>

                    <input type="text" name="nama" id="nama" placeholder="Jawaban Anda" required class="w-full max-w-[300px] border-b border-[#dadce0] pb-2 text-xs outline-none placeholder:text-[#70757a] focus:border-b-2 focus:border-[#5b4de0]">
                </div>

                <div class="rounded border border-[#dadce0] bg-white px-4 py-4">
                    <label for="umur" class="mb-4 block text-sm">
                        Berapa umur anda <span class="text-[#d93025]">*</span>
                    </label>

                    <input type="number" name="umur" id="umur" placeholder="Jawaban Anda" required class="w-full max-w-[300px] border-b border-[#dadce0] pb-2 text-xs outline-none placeholder:text-[#70757a] focus:border-b-2 focus:border-[#5b4de0]">
                </div>

                <div class="rounded border border-[#dadce0] bg-white px-4 py-4">
                    <p class="mb-3 text-sm">
                        Apa jenis kelamin Anda?
                    </p>

                    <div class="space-y-2">
                        <label class="flex cursor-pointer items-center gap-2 text-xs">
                            <input type="radio" name="kelamin" value="Laki-laki" required class="size-[18px] accent-[#5b4de0]">
                            Laki-laki
                        </label>

                        <label class="flex cursor-pointer items-center gap-2 text-xs">
                            <input type="radio" name="kelamin" value="Perempuan" class="size-[18px] accent-[#5b4de0]">
                            Perempuan
                        </label>
                    </div>
                </div>

                <div class="rounded border border-[#dadce0] bg-white px-4 py-4">
                    <p class="mb-3 text-sm">
                        Apakah anda perokok?
                    </p>

                    <div class="space-y-2">
                        <label class="flex cursor-pointer items-center gap-2 text-xs">
                            <input type="radio" name="perokok" value="Ya" required class="size-[18px] accent-[#5b4de0]">
                            Ya
                        </label>

                        <label class="flex cursor-pointer items-center gap-2 text-xs">
                            <input type="radio" name="perokok" value="Tidak" class="size-[18px] accent-[#5b4de0]">
                            Tidak
                        </label>
                    </div>
                </div>

                <div class="rounded border border-[#dadce0] bg-white px-4 py-4">
                    <p class="mb-3 text-sm">
                        Jika anda perokok, rokok apa yang pernah coba?
                    </p>

                    <div class="space-y-2">
                        <label class="flex cursor-pointer items-center gap-2 text-xs">
                            <input type="checkbox" name="rokok" value="Gudang Garam Filter" class="size-[18px] accent-[#5b4de0]">
                            Gudang Garam Filter
                        </label>

                        <label class="flex cursor-pointer items-center gap-2 text-xs">
                            <input type="checkbox" name="rokok" value="Lucky Strike" class="size-[18px] accent-[#5b4de0]">
                            Lucky Strike
                        </label>

                        <label class="flex cursor-pointer items-center gap-2 text-xs">
                            <input type="checkbox" name="rokok" value="Marlboro" class="size-[18px] accent-[#5b4de0]">
                            Marlboro
                        </label>

                        <label class="flex cursor-pointer items-center gap-2 text-xs">
                            <input type="checkbox" name="rokok" value="Esse" class="size-[18px] accent-[#5b4de0]">
                            Esse
                        </label>
                    </div>
                </div>

                <div class="flex items-center justify-between pt-1">
                    <input type="submit" value="Kirim" class="cursor-pointer rounded-sm bg-[#5b4de0] px-4 py-2 text-xs font-medium text-white hover:bg-[#5e35b1]">

                    <input type="reset" value="Kosongkan formulir" class="cursor-pointer bg-transparent text-xs font-medium text-[#5b4de0] hover:text-[#4a148c]">
                </div>

            </form>

            <div class="py-4 text-center">
                <a href="form.html" class="text-xs text-[#5b4de0] hover:underline">
                    Check Data
                </a>
            </div>

        </main>

        <script src="script.js"></script>
    </body>

</html>
